[package]
name = "pipkin-app"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "pipkin"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
pipkin-core = { path = "../pipkin-core" }
pipkin-ui = { path = "../pipkin-ui" }
pipkin-engine = { path = "../pipkin-engine" }
pipkin-engine-protocol = { path = "../pipkin-engine-protocol" }
libc = "0.2"
env_logger = "0.11"
log = "0.4"
async-channel = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
