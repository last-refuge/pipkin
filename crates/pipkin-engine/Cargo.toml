[package]
name = "pipkin-engine"
description = "Pipkin's built-in agent engine. GPUI-free; one async runtime; SQLite durable state."
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
pipkin-engine-protocol = { path = "../pipkin-engine-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "macros", "fs", "net", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
getrandom = "0.2"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
libc = "0.2"
regex = "1"
ignore = "0.4"
url = "2"
yaml-rust2 = { version = "0.13", default-features = false }
ring = "0.17"
zstd = { version = "0.13", default-features = false }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
unicode-normalization = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
icu_collator = "2.3"
icu_locale_core = "2.3"
regress = { version = "0.12", features = ["utf16"] }
# MCP client (plan: MCP-1). Pinned; client features only. The HTTP transport is wired through
# the generic client trait over the engine's own reqwest, never the SDK's reqwest 0.13.
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client"] }
sse-stream = "0.2"

[dev-dependencies]
tempfile = "3"
# The MCP fixture server (examples/mcp_fixture.rs) is built with the SDK's server side.
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "server", "macros", "schemars", "transport-child-process", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["test-util"] }

[features]
test-support = []
