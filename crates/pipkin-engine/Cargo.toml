[package]
name = "pipkin-engine"
description = "Pipkin's built-in agent engine. GPUI-free; one async runtime; SQLite durable state."
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
pipkin-engine-protocol = { path = "../pipkin-engine-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "macros", "fs", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
bytes = "1"
getrandom = "0.2"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
libc = "0.2"
regex = "1"
globset = "0.4"
ignore = "0.4"
url = "2"

[dev-dependencies]
tempfile = "3"
