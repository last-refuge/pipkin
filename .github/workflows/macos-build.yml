name: Experimental macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-engine:
    # Experimental platform evidence: this does not qualify macOS desktop UX or Gatekeeper acceptance.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            optional: false
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            optional: true
    # The Intel leg exists mainly to keep the x86_64 Rust build cache warm for the release
    # workflow, which is the only other place that target is built. It is best effort: no Intel
    # build has been checked on a Mac, and a failure there must not block the Apple Silicon leg.
    continue-on-error: ${{ matrix.optional }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "3"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_BACKTRACE: "1"
      TMPDIR: /private/tmp/pipkin-native-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Restore native Rust build cache
        id: native-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-native-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            ${{ runner.os }}-${{ runner.arch }}-native-
      - name: Prepare native dependencies and pinned toolchain
        run: |
          mkdir -p "$TMPDIR" qualification-logs
          chmod 700 "$TMPDIR"
          brew install cmake pkg-config
          toolchain=$(awk -F '"' '/^channel =/ {print $2}' rust-toolchain.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          uname -a > qualification-logs/runner.txt
          rustc -vV > qualification-logs/rustc.txt
          xcodebuild -version > qualification-logs/xcode.txt
          git rev-parse HEAD > qualification-logs/app-revision.txt
      - name: Reject Node, npm and Pi during native qualification
        run: |
          mkdir -p "$RUNNER_TEMP/native-shims"
          for tool in node npm npx pi; do
            printf '#!/bin/sh\necho "unexpected native dependency: %s" >&2\ntouch "%s/native-forbidden-invocations"\nexit 93\n' \
              "$tool" "$RUNNER_TEMP" > "$RUNNER_TEMP/native-shims/$tool"
            chmod +x "$RUNNER_TEMP/native-shims/$tool"
          done
          echo "$RUNNER_TEMP/native-shims" >> "$GITHUB_PATH"
      - name: Build and verify the native macOS app and ZIP
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -o pipefail
          python3 scripts/test-package-macos.py
          target=$(rustc -vV | awk '/^host:/ {print $2}')
          test "$target" = "$TARGET" || { echo "runner builds $target, expected $TARGET" >&2; exit 1; }
          cargo fetch --locked --target "$target" 2>&1 | tee qualification-logs/notice-inputs.log
          PIPKIN_REVISION="$(git rev-parse HEAD)" cargo build -p pipkin-app --release --locked 2>&1 | tee qualification-logs/build.log
          python3 scripts/write-license-inventory.py dist/macos-notices "$target" 2>&1 | tee qualification-logs/notices.log
          python3 scripts/package-macos.py "$target" --app-only 2>&1 | tee qualification-logs/package.log
          cp dist/macos/build-info.json dist/macos/SHA256SUMS qualification-logs/
          test ! -e "$RUNNER_TEMP/native-forbidden-invocations"
      - name: Retain experimental native ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pipkin-macos-${{ runner.arch }}-${{ github.sha }}
          path: |
            dist/macos/*.zip
            dist/macos/build-info.json
            dist/macos/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      # The build runs before the tests so that the cache this job saves under the commit's
      # key (shared with the release workflow) carries the release-profile artifacts even when
      # an engine test loses a race; the release job at the same commit then gets an exact hit.
      - name: Native engine, protocol and actual app worker checks
        run: |
          set -o pipefail
          cargo test -p pipkin-engine -p pipkin-engine-protocol --locked 2>&1 | tee qualification-logs/native-engine.log
          cargo test -p pipkin-app --locked --test engine_worker --test native_diagnose 2>&1 | tee qualification-logs/native-worker.log
          cargo test -p pipkin-app --locked adapters::native:: 2>&1 | tee qualification-logs/native-adapter.log
          test ! -e "$RUNNER_TEMP/native-forbidden-invocations"
      - name: Save native Rust build cache even after failed qualification
        if: always() && steps.native-cache.outputs.cache-primary-key != '' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Retain experimental native evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-native-engine-${{ github.sha }}
          path: qualification-logs/
          if-no-files-found: warn
          retention-days: 30
