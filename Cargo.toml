[workspace]
resolver = "2"
members = ["crates/pipkin-core", "crates/pipkin-ui", "crates/pipkin-app", "crates/pi-client", "crates/pipkin-engine-protocol", "crates/pipkin-engine"]
exclude = ["zed", "vendor/reqwest-0.12.28"]

[workspace.package]
edition = "2024"
version = "0.0.1"
publish = false
license = "MIT"

[workspace.dependencies]
# GPUI is pre-1.0. Both crates are pinned to the same full Zed revision; see docs/decisions.md.
gpui = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a", default-features = false, features = ["wayland", "x11", "font-kit"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "a84689073d296dfd39987bc7dd478e43ef76d83a", default-features = false, features = ["wayland", "x11", "font-kit"] }

[profile.release]
debug = "line-tables-only"

[patch.crates-io]
# CONNECT for plain HTTP targets; defaults unchanged for other reqwest consumers.
reqwest = { path = "vendor/reqwest-0.12.28" }
